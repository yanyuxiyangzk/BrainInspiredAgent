[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainagent-domain-sdk"
version = "0.1.0.dev0"
requires-python = ">=3.11"
dependencies = [
  "brainagent-kernel==0.1.0.dev0",
  "brainagent-platform==0.1.0.dev0",
]

[tool.setuptools.packages.find]
where = ["../.."]
include = ["domain_sdk*"]
