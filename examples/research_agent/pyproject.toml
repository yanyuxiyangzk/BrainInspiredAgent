[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainagent-research-example"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "brainagent-domain-sdk>=0.1,<0.2",
  "brainagent-platform>=0.1,<0.2",
]

[project.entry-points."brainagent.plugins"]
research = "research_agent:ResearchAgentPlugin"

[tool.setuptools.packages.find]
include = ["research_agent*"]
