[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bia-agent"
version = "0.1.0.dev0"
description = "Domain-neutral brain agent kernel and active-agent platform"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "jsonschema>=4.26.0",
    "prompt-toolkit>=3.0.52,<4",
]

[project.scripts]
bia = "apps.quant_agent.cli:main"
brainagent = "apps.brainagent_cli:main"

[dependency-groups]
dev = [
    "build>=1.5.0",
    "mypy>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "setuptools>=68",
]

[tool.setuptools.packages.find]
include = ["brain_kernel*", "active_agent_platform*", "domain_sdk*", "apps*"]

[tool.setuptools.data-files]
"schemas/capability" = ["schemas/capability/*.json"]
"schemas/dna" = ["schemas/dna/*.json"]
"schemas/error" = ["schemas/error/*.json"]
"schemas/event" = ["schemas/event/*.json"]
"schemas/evolution" = ["schemas/evolution/*.json"]
"schemas/execution" = ["schemas/execution/*.json"]
"schemas/plan" = ["schemas/plan/*.json"]
"schemas/skill" = ["schemas/skill/*.json"]
"schemas/task" = ["schemas/task/*.json"]
"schemas/workflow" = ["schemas/workflow/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=brain_kernel --cov=active_agent_platform --cov=domain_sdk --cov=apps --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["brain_kernel", "active_agent_platform", "domain_sdk", "apps"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    '\.\.\.$',
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv/**", "node_modules/**", "**/build/**", "**/dist/**", "**/*.egg-info/**"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["brain_kernel", "active_agent_platform", "domain_sdk", "apps"]
